databases:
  - name: rentfit_db
    plan: free
    region: singapore

services:
  # Backend Web Service
  - type: web
    name: rentfit-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Rentfit.wsgi:application"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentfit_db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Site
  - type: static
    name: rentfit-frontend
    runtime: node
    region: singapore
    plan: free
    buildCommand: "npm install && npm run build"
    publishPath: dist
    rootDir: rentfit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rentfit-backend.onrender.com
